name: Build Fedora RPM

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-rpm:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.fedora == 'rawhide' }}
    strategy:
      fail-fast: false
      matrix:
        fedora:
          - latest
          - rawhide

    container:
      image: quay.io/fedora/fedora:${{ matrix.fedora }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RPM build tools and dependencies
        run: |
          dnf install -y 'dnf-command(builddep)' rpm-build tar gzip findutils sed
          dnf builddep -y packaging/rpm/kde-per-app-scrolling.spec

      - name: Prepare source tarball and build RPMs
        run: |
          SPEC_SRC="packaging/rpm/kde-per-app-scrolling.spec"
          TOPDIR="$PWD/rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          cp "$SPEC_SRC" "$TOPDIR/SPECS/kde-per-app-scrolling.spec"

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            sed -i "s/^Version:.*/Version:        ${TAG_VERSION}/" "$TOPDIR/SPECS/kde-per-app-scrolling.spec"
          fi

          VERSION="$(awk '/^Version:/ { print $2; exit }' "$TOPDIR/SPECS/kde-per-app-scrolling.spec")"
          TARBALL="$TOPDIR/SOURCES/kde-per-app-scrolling-${VERSION}.tar.gz"

          tar \
            --exclude=".git" \
            --exclude="kcm/build" \
            --exclude="rpmbuild" \
            --exclude="__pycache__" \
            --exclude="*.pyc" \
            --transform="s,^\.,kde-per-app-scrolling-${VERSION}," \
            -czf "$TARBALL" .

          rpmbuild --define "_topdir $TOPDIR" -ba "$TOPDIR/SPECS/kde-per-app-scrolling.spec"

          mkdir -p dist
          find "$TOPDIR/RPMS" "$TOPDIR/SRPMS" -name '*.rpm' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-${{ matrix.fedora }}-rpms
          path: dist/*.rpm

  release:
    name: Create GitHub Release
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Fedora latest RPMs
        uses: actions/download-artifact@v4
        with:
          name: fedora-latest-rpms
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.rpm
          generate_release_notes: true
